<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Event Participants</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary"></nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h5 mb-0">Event Participants</h1>
          <a id="back-link" href="#" class="btn btn-outline-secondary btn-sm">Back to Event</a>
        </div>

        <div id="not-found" class="alert alert-warning d-none">
          Event not found.
        </div>

        <div id="empty-state" class="alert alert-secondary d-none">
          No one has RSVP'd "going" to this event yet.
        </div>

        <div id="participants-table-wrap" class="card shadow-sm p-3 d-none">
          <table class="table table-sm mb-0">
            <thead>
              <tr>
                <th>Name</th>
                <th>Username</th>
                <th>City</th>
              </tr>
            </thead>
            <tbody id="participants-body"></tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="../js/navbar.js"></script>
  <script src="../js/util.js"></script>
  <script src="js/participants.js"></script>
</body>
</html>
