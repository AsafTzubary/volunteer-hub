<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Profile</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary"></nav>

  <main class="container py-4">

    <div id="not-found" class="d-none">
      <div class="alert alert-warning mt-4">User not found.</div>
    </div>

    <div id="profile-content" class="d-none">
      <div class="row g-4">

        <aside class="col-lg-4">
          <div class="card shadow-sm text-center p-4 mb-4">
            <canvas id="avatar-canvas" width="100" height="100" class="rounded-circle mx-auto mb-3"></canvas>
            <h2 id="profile-fullname" class="h5 mb-0"></h2>
            <p id="profile-username" class="text-muted small mb-1"></p>
            <p id="profile-city" class="text-muted small mb-2"></p>
            <p id="profile-member-since" class="text-muted small mb-3"></p>
            <div id="owner-actions" class="d-none">
              <a href="edit.html" class="btn btn-primary btn-sm w-100">Edit Profile</a>
            </div>
            <div id="add-friend" class="d-none">
              <button id="add-friend-btn" class="btn btn-primary btn-sm w-100">Add Friend</button>
            </div>
            <div id="remove-friend" class="d-none">
              <button id="remove-friend-btn" class="btn btn-danger btn-sm w-100">Remove Friend</button>
            </div>
            <p id="profile-email" class="d-none mt-3 mb-0 small text-secondary"></p>
          </div>

          <div class="card shadow-sm p-3 mb-4">
            <h3 class="h6 mb-2">Interests</h3>
            <div id="interests-list">
              <span class="text-muted small">No interests listed yet.</span>
            </div>
          </div>

          <div class="card shadow-sm p-3">
            <h3 class="h6 mb-2">Friends <span id="friends-count" class="badge bg-secondary"></span></h3>
            <ul id="friends-list" class="list-unstyled mb-0"></ul>
          </div>
        </aside>

        <section class="col-lg-8">

          <div class="card shadow-sm p-3 mb-4">
            <h3 class="h6 mb-3">Volunteer Groups <span id="groups-count" class="badge bg-secondary"></span></h3>
            <div id="groups-list">
              <p class="text-muted small mb-0">Not a member of any groups yet.</p>
            </div>
          </div>

          <div class="card shadow-sm p-3">
            <h3 class="h6 mb-3">Recent Activity</h3>
            <div id="activity-list">
              <p class="text-muted small mb-0">No recent activity to show.</p>
            </div>
          </div>

        </section>
      </div>
    </div>

  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="../js/util.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
