<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Search Events</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary"></nav>

  <main class="container py-4">
    <h1 class="h4 mb-3">Search Events</h1>

    <div class="card shadow-sm p-3 mb-3">
      <form id="search-form" class="row g-2">
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-address" class="form-label small mb-1">Address</label>
          <input type="text" class="form-control form-control-sm" id="filter-address" placeholder="Search by address" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-category" class="form-label small mb-1">Category</label>
          <input type="text" class="form-control form-control-sm" id="filter-category" placeholder="e.g. Sports" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-date-from" class="form-label small mb-1">Date From</label>
          <input type="date" class="form-control form-control-sm" id="filter-date-from" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-date-to" class="form-label small mb-1">Date To</label>
          <input type="date" class="form-control form-control-sm" id="filter-date-to" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-status" class="form-label small mb-1">Status</label>
          <select class="form-select form-select-sm" id="filter-status">
            <option value="">Any</option>
            <option value="upcoming">Upcoming</option>
            <option value="full">Full</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-sort" class="form-label small mb-1">Sort</label>
          <select class="form-select form-select-sm" id="filter-sort">
            <option value="date_asc">Soonest first</option>
            <option value="date_desc">Latest first</option>
            <option value="createdAt_desc">Newest posted</option>
          </select>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="filter-available-only" />
            <label class="form-check-label small" for="filter-available-only">Only show events with open spots</label>
          </div>
        </div>
        <div class="col-12 d-flex gap-2 mt-1">
          <button type="submit" class="btn btn-primary btn-sm">Search</button>
          <button type="button" id="clear-filters-btn" class="btn btn-outline-secondary btn-sm">Clear</button>
        </div>
      </form>
    </div>

    <div id="active-filters" class="d-flex flex-wrap gap-2 mb-3"></div>

    <div id="results-list" class="d-flex flex-column gap-3"></div>

    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button id="prev-page-btn" class="btn btn-outline-secondary btn-sm">Previous</button>
      <span id="page-indicator" class="text-muted small"></span>
      <button id="next-page-btn" class="btn btn-outline-secondary btn-sm">Next</button>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/util.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
