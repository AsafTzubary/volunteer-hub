<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Admin Panel</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">Volunteer Hub</a>
      <div class="d-flex gap-2 align-items-center">
        <a id="my-profile-link" href="#" class="btn btn-outline-light btn-sm">My Profile</a>
        <button id="logout-btn" class="btn btn-outline-light btn-sm">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h4 mb-4">Admin Panel</h1>

    <div class="row g-3 mb-5">
      <div class="col-6 col-md-3">
        <div class="card shadow-sm text-center p-3">
          <div id="kpi-users" class="fs-2 fw-bold text-primary">—</div>
          <div class="text-muted small">Users</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card shadow-sm text-center p-3">
          <div id="kpi-groups" class="fs-2 fw-bold text-success">—</div>
          <div class="text-muted small">Groups</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card shadow-sm text-center p-3">
          <div id="kpi-events" class="fs-2 fw-bold text-warning">—</div>
          <div class="text-muted small">Events</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card shadow-sm text-center p-3">
          <div id="kpi-rsvps" class="fs-2 fw-bold text-danger">—</div>
          <div class="text-muted small">RSVPs (going)</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm p-4">
          <h2 class="h6 mb-3">Members by Group Categories</h2>
          <div id="chart-members-by-category"></div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm p-4">
          <h2 class="h6 mb-3">Event Sign-Ups by Month</h2>
          <div class="d-flex gap-2 align-items-center mb-3 flex-wrap">
            <div>
              <label for="filter-from" class="form-label small mb-1">From</label>
              <input type="month" id="filter-from" class="form-control form-control-sm" />
            </div>
            <div>
              <label for="filter-to" class="form-label small mb-1">To</label>
              <input type="month" id="filter-to" class="form-control form-control-sm" />
            </div>
            <button id="filter-apply" class="btn btn-primary btn-sm mt-3">Apply</button>
            <button id="filter-reset" class="btn btn-outline-secondary btn-sm mt-3">Reset</button>
          </div>
          <div id="chart-registrations-by-month"></div>
        </div>
      </div>
    </div>

  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
