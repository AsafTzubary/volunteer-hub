<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Users</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/user.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary"></nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">All Users</h1>
      <span id="results-count" class="text-muted small"></span>
    </div>

    <div class="card shadow-sm p-3 mb-3">
      <form id="search-form" class="row g-2">
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-name" class="form-label small mb-1">Name</label>
          <input type="text" class="form-control form-control-sm" id="filter-name" placeholder="Name or username" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-city" class="form-label small mb-1">City</label>
          <input type="text" class="form-control form-control-sm" id="filter-city" placeholder="e.g. Haifa" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-interest" class="form-label small mb-1">Interest</label>
          <input type="text" class="form-control form-control-sm" id="filter-interest" placeholder="e.g. Gardening" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-joined-from" class="form-label small mb-1">Joined From</label>
          <input type="date" class="form-control form-control-sm" id="filter-joined-from" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-joined-to" class="form-label small mb-1">Joined To</label>
          <input type="date" class="form-control form-control-sm" id="filter-joined-to" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-sort" class="form-label small mb-1">Sort</label>
          <select class="form-select form-select-sm" id="filter-sort">
            <option value="name_asc">Name (A-Z)</option>
            <option value="name_desc">Name (Z-A)</option>
            <option value="createdAt_desc">Newest members</option>
          </select>
        </div>
        <div class="col-12 d-flex justify-content-between align-items-center mt-1">
          <div class="form-check mb-0">
            <input type="checkbox" class="form-check-input" id="filter-friends-only" />
            <label class="form-check-label small" for="filter-friends-only">Only show my friends</label>
          </div>
          <!-- No Search button: every field above searches as you change it,
               so a Search button would only repeat the search that already
               ran. Clear is not redundant - it is the only way to reset every
               field, the sort and the chips in one action. -->
          <button type="button" id="clear-filters-btn" class="btn btn-outline-secondary btn-sm">Clear</button>
        </div>
      </form>
    </div>

    <div id="active-filters" class="d-flex flex-wrap gap-2 mb-3"></div>

    <p id="status-message" class="small text-danger d-none"></p>

    <div id="users-grid" class="row g-3"></div>

    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button id="prev-page-btn" class="btn btn-outline-secondary btn-sm">Previous</button>
      <span id="page-indicator" class="text-muted small"></span>
      <button id="next-page-btn" class="btn btn-outline-secondary btn-sm">Next</button>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/util.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
