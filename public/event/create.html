<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Create Event</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary"></nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div id="create-event-content" class="col-lg-6 d-none">
        <div class="card shadow-sm p-4">
          <h1 class="h5 mb-3">Create an Event</h1>

          <div id="form-error" class="alert alert-danger d-none"></div>

          <form id="create-event-form">
            <div class="mb-3">
              <label for="title" class="form-label">Event Title</label>
              <input type="text" id="title" name="title" class="form-control" required maxlength="100" />
            </div>

            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <input type="text" id="category" name="category" class="form-control" required maxlength="40" />
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" name="description" class="form-control" rows="3" maxlength="1000"></textarea>
            </div>

            <div class="mb-3">
              <label for="date" class="form-label">Date &amp; Time</label>
              <input type="datetime-local" id="date" name="date" class="form-control" required />
            </div>

            <div class="mb-3 position-relative">
              <label for="address-search" class="form-label">Address</label>
              <input type="text" id="address-search" class="form-control" placeholder="Search for an address..." autocomplete="off" />
              <ul id="address-suggestions" class="list-group position-absolute w-100 d-none" style="z-index:100;top:100%"></ul>
              <div id="address-confirmed" class="form-text text-success d-none"></div>
            </div>


            <div class="mb-3">
              <label for="maxParticipants" class="form-label">Max Participants</label>
              <input type="number" id="maxParticipants" name="maxParticipants" class="form-control" required min="1" max="500" />
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" id="save-btn" class="btn btn-primary">Create Event</button>
              <a id="cancel-link" href="#" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="../js/navbar.js"></script>
  <script src="../js/util.js"></script>
  <script src="../js/address-autocomplete.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
