<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">Volunteer Hub</a>
      <div class="d-flex gap-2 align-items-center">
        <a id="my-profile-link" href="#" class="btn btn-outline-light btn-sm">My Profile</a>
        <button id="logout-btn" class="btn btn-outline-light btn-sm">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">

      <aside class="col-lg-3">
        <div class="card shadow-sm p-4 mb-3 text-center">
          <div id="profile-avatar" class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle bg-primary text-white fw-bold" style="width:64px;height:64px;font-size:1.6rem"></div>
          <h1 id="profile-name" class="h6 mb-1"></h1>
          <p id="profile-city" class="text-muted small mb-3"></p>
          <a id="profile-link" href="#" class="btn btn-outline-primary btn-sm">My Profile</a>
        </div>

        <div class="card shadow-sm p-3 mb-3">
          <h2 class="h6 mb-2">My Groups</h2>
          <ul id="joined-groups-list" class="list-unstyled mb-2"></ul>
          <a href="/group/list.html" class="small text-muted text-decoration-none">Browse all groups...</a>
        </div>

        <div class="card shadow-sm p-3">
          <h2 class="h6 mb-2">Upcoming Events</h2>
          <ul id="upcoming-events-list" class="list-unstyled mb-2"></ul>
          <a href="/event/map.html" class="small text-muted text-decoration-none">See all events...</a>
        </div>
      </aside>

      <section class="col-lg-9">
        <div id="feed-container" class="card shadow-sm p-4 mb-3">
          <p id="feed-empty" class="text-muted small mb-0">Your feed will appear here.</p>
        </div>
        <div class="text-center">
          <button id="load-more-btn" class="btn btn-outline-secondary btn-sm d-none">Load more</button>
        </div>
      </section>

    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="js/util.js"></script>
  <script src="js/post-card.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
