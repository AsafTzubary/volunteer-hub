<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - All Events</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary"></nav>

  <main class="container py-4">
    <header class="mb-4 d-flex justify-content-between align-items-center">
      <div>
        <h1 class="h4 mb-0">Upcoming Events</h1>
        <p id="events-summary" class="text-muted small mb-0"></p>
      </div>
      <a href="/event/search.html" class="btn btn-outline-primary btn-sm">Search Events</a>
    </header>

    <div class="row g-4">

      <section class="col-lg-5 order-2 order-lg-1">
        <div id="events-list" class="d-flex flex-column gap-3">
          <p class="text-muted small">Loading events...</p>
        </div>
      </section>

      <aside class="col-lg-7 order-1 order-lg-2">
        <div class="map-sticky">
          <div class="card shadow-sm map-panel position-relative overflow-hidden">
            <div id="map" class="w-100 h-100"></div>
            <div
              id="map-message"
              class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center text-muted p-3 text-center"
              style="background:#e0e0e0"
            >
              <span class="small">Loading map...</span>
            </div>
          </div>
          <p class="text-muted small mt-2 mb-0">
            <span class="d-inline-block rounded-circle align-middle me-1" style="width:10px;height:10px;background:#0d6efd"></span>Open
            <span class="d-inline-block rounded-circle align-middle ms-3 me-1" style="width:10px;height:10px;background:#6c757d"></span>Full
          </p>
        </div>
      </aside>

    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/util.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
