<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Something Went Wrong</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">Volunteer Hub</a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center text-center">
      <div class="col-lg-6">
        <div class="card shadow-sm p-5">
          <h1 class="display-4 fw-bold text-danger mb-3" id="status-code">500</h1>
          <h2 class="h5 mb-3">Something Went Wrong</h2>
          <p class="text-muted mb-4">
            This one is on us, not on you. The problem has been logged and nothing you were working on was lost. Try again in a moment.
          </p>
          <p class="text-muted small d-none mb-4" id="error-ref">
            Reference code: <code id="error-ref-value"></code>
          </p>
          <a href="/dashboard.html" class="btn btn-primary">Back to Dashboard</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);

    const status = params.get('status');
    if (/^5\d{2}$/.test(status)) {
      document.getElementById('status-code').textContent = status;
    }

    const ref = params.get('ref');
    if (ref && /^[a-f0-9]{8}$/.test(ref)) {
      document.getElementById('error-ref-value').textContent = ref;
      document.getElementById('error-ref').classList.remove('d-none');
    }
  </script>

</body>
</html>
