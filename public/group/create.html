<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Create Group</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/group.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">Volunteer Hub</a>
      <div class="d-flex gap-2 align-items-center">
        <a id="my-profile-link" href="#" class="btn btn-outline-light btn-sm">My Profile</a>
        <button id="logout-btn" class="btn btn-outline-light btn-sm">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div id="create-group-content" class="col-lg-6 d-none">
        <div class="card shadow-sm p-4">
          <h1 class="h5 mb-3">Create a Group</h1>

          <div id="form-error" class="alert alert-danger d-none"></div>

          <form id="create-group-form">
            <div class="mb-3">
              <label for="name" class="form-label">Group Name</label>
              <input type="text" id="name" name="name" class="form-control" required maxlength="60" />
            </div>

            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <input type="text" id="category" name="category" class="form-control" required maxlength="40" />
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" name="description" class="form-control" rows="3" maxlength="500"></textarea>
            </div>


            <div class="d-flex gap-2 mt-4">
              <button type="submit" id="save-btn" class="btn btn-primary">Create Group</button>
              <a href="/dashboard.html" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="../js/util.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
