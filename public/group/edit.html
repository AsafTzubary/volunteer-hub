<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Edit Group</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/group.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary"></nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-6">

        <div class="card shadow-sm p-4">
          <h1 class="h5 mb-4">Edit Group</h1>

          <form id="edit-group-form" novalidate>

            <div class="mb-3">
              <label for="name" class="form-label">Group Name</label>
              <input type="text" class="form-control" id="name" name="name" maxlength="60" required />
              <div class="invalid-feedback" id="name-error"></div>
            </div>

            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <input type="text" class="form-control" id="category" name="category" maxlength="40" required />
              <div class="invalid-feedback" id="category-error"></div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" name="description" rows="3" maxlength="500"></textarea>
              <div class="invalid-feedback" id="description-error"></div>
            </div>


            <div id="form-error" class="alert alert-danger d-none" role="alert"></div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <a id="cancel-link" href="#" class="btn btn-outline-secondary">Cancel</a>
            </div>

          </form>
        </div>

      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="../js/util.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
