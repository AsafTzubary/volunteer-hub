<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Event Details</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">Volunteer Hub</a>
      <div class="d-flex gap-2 align-items-center">
        <a id="my-profile-link" href="#" class="btn btn-outline-light btn-sm">My Profile</a>
        <button id="logout-btn" class="btn btn-outline-light btn-sm">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div id="not-found" class="d-none">
      <div class="alert alert-warning mt-4">Event not found.</div>
    </div>

    <div id="event-content" class="d-none">
      <div class="row g-4">
        <aside class="col-lg-4">
          <div class="card shadow-sm p-4 mb-4">
            <span id="event-category" class="category-badge mb-2 align-self-start"></span>
            <h1 id="event-title" class="h4 mb-3"></h1>
            <p id="event-date" class="text-muted small mb-1"></p>
            <p id="event-address" class="text-muted small mb-3"></p>
          </div>
          <div class="card shadow-sm p-3 mb-4">
            <h2 class="h6 mb-2">Manager</h2>
            <div id="manager-info"></div>
            <p class="small mb-1">Group: <a id="event-group-link" href="#"></a></p>
            <p id="event-participants" class="small mb-0"></p>
          </div>

        </aside>

        <section class="col-lg-8">

          <div class="card shadow-sm p-3 mb-4">
            <div id="manager-badge" class="alert alert-primary small d-none">You manage this event.</div>
            <div id="participant-badge" class="alert alert-success small d-none">You're registered for this event.</div>
            <h2 class="h6 mb-2">About</h2>
            <p id="event-description" class="mb-0"></p>
          </div>

        </section>
      </div>
    </div>

  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/util.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
