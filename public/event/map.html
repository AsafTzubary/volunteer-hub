<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - All Events</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">Volunteer Hub</a>
      <div class="d-flex gap-2 align-items-center">
        <a id="my-profile-link" href="#" class="btn btn-outline-light btn-sm">My Profile</a>
        <button id="logout-btn" class="btn btn-outline-light btn-sm">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <header class="mb-4 d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">Upcoming Events</h1>
      <a href="/event/search.html" class="btn btn-outline-primary btn-sm">Search Events</a>
    </header>

    <div class="row g-4">

      <section class="col-lg-5">
        <div id="events-list" class="d-flex flex-column gap-3">
          <p class="text-muted small">Loading events...</p>
        </div>
      </section>

      <aside class="col-lg-7">
        <div class="card shadow-sm" style="height:520px">
          <div id="map-placeholder" class="w-100 h-100 d-flex align-items-center justify-content-center text-muted rounded" style="background:#e0e0e0">
            <span class="small">Map coming soon</span>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/util.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
