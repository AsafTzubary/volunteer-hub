<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Hub - Groups</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/group.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary"></nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Groups</h1>
      <a href="/group/create.html" class="btn btn-primary btn-sm">Create Group</a>
    </div>

    <div class="card shadow-sm p-3 mb-3">
      <form id="search-form" class="row g-2">
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-name" class="form-label small mb-1">Name</label>
          <input type="text" class="form-control form-control-sm" id="filter-name" placeholder="Search by name" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-category" class="form-label small mb-1">Category</label>
          <input type="text" class="form-control form-control-sm" id="filter-category" placeholder="e.g. Sports" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-min-members" class="form-label small mb-1">Min Members</label>
          <input type="number" min="0" class="form-control form-control-sm" id="filter-min-members" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-max-members" class="form-label small mb-1">Max Members</label>
          <input type="number" min="0" class="form-control form-control-sm" id="filter-max-members" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-created-from" class="form-label small mb-1">Created From</label>
          <input type="date" class="form-control form-control-sm" id="filter-created-from" />
        </div>
        <div class="col-6 col-md-4 col-lg-2">
          <label for="filter-created-to" class="form-label small mb-1">Created To</label>
          <input type="date" class="form-control form-control-sm" id="filter-created-to" />
        </div>
        <div class="col-12 d-flex gap-2 mt-1">
          <button type="submit" class="btn btn-primary btn-sm">Search</button>
          <button type="button" id="clear-filters-btn" class="btn btn-outline-secondary btn-sm">Clear</button>
        </div>
      </form>
    </div>

    <div id="groups-grid" class="row g-3"></div>

    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button id="prev-page-btn" class="btn btn-outline-secondary btn-sm">Previous</button>
      <span id="page-indicator" class="text-muted small"></span>
      <button id="next-page-btn" class="btn btn-outline-secondary btn-sm">Next</button>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2025 Volunteer Hub
  </footer>

  <script src="../js/navbar.js"></script>
  <script src="../js/util.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
